name: Reset News (Manual Only)

# 手動実行のみ (Actions タブから「Run workflow」ボタンで起動)
on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: NEWS リセットスクリプトを実行
        run: python scripts/reset_news.py

      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "🧹 NEWS 配列をリセット (手動実行)"
            git push
          fi
